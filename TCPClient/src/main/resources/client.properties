# TCPClient settings. Edit this file and restart; no recompiling needed.
#
# These values are used when the client is started WITHOUT arguments.
# Arguments win over this file:  java -jar TCPClient.jar <ServerIPAddress> <PortNumber>
#
# The client looks for this file in this order:
#   1. the path given with  -Dchat.config=/path/to/client.properties
#   2. ./client.properties  (next to where you start the client)
#   3. the copy bundled inside the JAR (this one)

# IP address or host name of the chat server.
server.host=localhost

# TCP port of the chat server.
server.port=3000
