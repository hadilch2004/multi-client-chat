# TCPServer settings. Edit this file and restart; no recompiling needed.
#
# The server looks for this file in this order:
#   1. the path given with  -Dchat.config=/path/to/server.properties
#   2. ./server.properties  (next to where you start the server)
#   3. the copy bundled inside the JAR (this one)

# Network interface to listen on. 0.0.0.0 = every interface (other computers can connect).
# Use localhost to accept connections from this computer only.
server.host=0.0.0.0

# TCP port the clients connect to.
server.port=3000
